aid: koppla
name: Koppla
description: 'koppla GmbH is a Potsdam, Germany based construction technology company
  building Bauterminplan (construction scheduling) software for general contractors,
  general planners, project developers and architects. The cloud platform combines
  lean-construction scheduling, day-to-day project control and collaboration, standardized
  company-wide templates, reporting and analytics, a jobsite mobile app, AI-assisted
  import of existing schedules from MS Project, Asta Powerproject and Primavera, and
  a BIM integration that adds the time dimension (4D) to the model. koppla states that
  more than 100 construction companies and 600+ live projects run on the platform,
  covering over EUR 15 billion of managed construction volume. An open interface (API)
  plus a Power BI integration are offered as part of the Enterprise plan; koppla does
  not publish a public developer portal, API reference or machine-readable
  specification, so the API is available under contract rather than via self-service
  onboarding.'
