  description: 'koppla advertises an "Offene Schnittstelle / API" (open interface /
    API) as an included capability of its Enterprise plan, alongside a Power BI
    integration that pushes koppla schedule data into customer reporting, and a BIM
    integration that carries schedule data into the 3D model. The live surface is a
    GraphQL API at https://api.koppla.de/api/graphql/v1 - 384 types, 73 queries and
    81 mutations covering projects, orders (scheduled activities), tickets,
    milestones, trade sequences, memberships, photos and exports. It uses Relay
    cursor connections throughout, bearer-token auth backed by WorkOS SSO, and
    role-based multi-tenant access. Schema introspection is answered without
    credentials (which is how this profile captured the schema) while data access is
    correctly gated behind UNAUTHENTICATED. There is no idempotency mechanism. 45
    fields are deprecated with stated replacements, six of them pointing at an
    in-progress REST API (api-v2.koppla.de). koppla publishes no developer portal,
    API reference, SDK or sandbox; access is provisioned per Enterprise contract.'
