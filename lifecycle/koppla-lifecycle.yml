platform_migration:
  direction: GraphQL -> REST
  evidence_count: 6
  target_host: https://api-v2.koppla.de
  note: Six GraphQL operations are deprecated in favour of REST endpoints, indicating an in-progress
    migration to a REST API. The REST surface is referenced by the web client config but is not publicly
    documented and is not reachable unauthenticated.
  operations:
  - operation: Mutation.updateTenant
    replacement: Use REST API PATCH /tenants/:tenantId and PUT /tenants/:tenantId/image instead
  - operation: Query.project
    replacement: Use GET /projects/:projectId on the REST API instead.
  - operation: Query.projectMilestones
    replacement: Use REST API GET /projects/:projectId/milestones instead
  - operation: Query.projectMilestone
    replacement: Use REST API GET /projects/:projectId/milestones instead
  - operation: Query.wbsSections
    replacement: Use REST API GET /projects/:projectId/wbs-sections instead.
  - operation: Query.tenant
    replacement: Use REST API GET /tenants/:tenantId instead
